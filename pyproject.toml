[project]
name = "facial-emotion-recognition"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.29.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "tensorflow>=2.21.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "onnx>=1.22.0",
    "pytest>=9.1.1",
    "tf2onnx>=1.17.0",
]

